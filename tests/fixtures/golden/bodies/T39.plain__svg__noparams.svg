-width:2;}#mermaid-svg .ishikawa text{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid-svg .ishikawa .ishikawa-head-label{font-weight:600;text-anchor:middle;dominant-baseline:middle;font-size:14px;}#mermaid-svg .ishikawa .ishikawa-label{text-anchor:end;}#mermaid-svg .ishikawa .ishikawa-label.cause{text-anchor:middle;dominant-baseline:middle;}#mermaid-svg .ishikawa .ishikawa-label.align{text-anchor:end;dominant-baseline:middle;}#mermaid-svg .ishikawa .ishikawa-label.up{dominant-baseline:baseline;}#mermaid-svg .ishikawa .ishikawa-label.down{dominant-baseline:hanging;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g class="ishikawa"><defs><marker id="ishikawa-arrow-mermaid-svg" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 10 0 L 0 5 L 10 10 Z" class="ishikawa-arrow"/></marker></defs><line class="ishikawa-spine" x1="-298.90264892578125" y1="333.3333333333333