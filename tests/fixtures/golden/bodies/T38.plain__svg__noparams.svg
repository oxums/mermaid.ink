<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" style="max-width: 800px;" role="graphics-document document" aria-roledescription="venn" xmlns:xlink="http://www.w3.org/1999/xlink"><style xmlns="http://www.w3.org/1999/xhtml">@import url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.2.0/css/all.min.css");</style><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .venn-title{font-size:32px;fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-svg .venn-circle text{font-size:48px;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-svg .venn-intersection text{font-size:48px;fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-svg .venn-text-node{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><text class="venn-title" font-size="16px" text-anchor="middle" dominant-baseline="middle" x="50%" y="16" style="fill: rgb(51, 51, 51);">Programming skills</text><g transform="translate(0, 24)"><g class="venn-area venn-circle venn-set-0" data-venn-sets="A"><path d="&#10;M 274.32849039325265 213 &#10;m -198 0 &#10;a 198 198 0 1 0 396 0 &#10;a 198 198 0 1 0 -396 0" style="fill-opacity: 0.1; fill: rgb(83, 83, 255); stroke: rgb(83, 83, 255); stroke-width: 2.5; stroke-opacity: 0.95;"/><text class="label" text-anchor="middle" dy=".35em" x="202" y="213" style="fill: rgb(0, 0, 185); font-size: 24px;"><tspan x="202" y="213" dy="0.35em">Frontend</tspan></text></g><g class="venn-area venn-circle venn-set-1" data-venn-sets="B"><path d="&#10;M 525.6715096067473 213 &#10;m -198 0 &#10;a 198 198 0 1 0 396 0 &#10;a 198 198 0 1 0 -396 0" style="fill-opacity: 0.1; fill: rgb(255, 255, 69); stroke: rgb(255, 255, 69); stroke-width: 2.5; stroke-opacity: 0.95;"/><text class="label" text-anchor="middle" dy=".35em" x="598" y="213" style="fill: rgb(171, 171, 0); font-size: 24px;"><tspan x="598" y="213" dy="0.35em">Backend</tspan></text></g><g class="venn-area venn-intersection" data-venn-sets="A_B"><path d="&#10;M 400 366.0054628866604 &#10;A 198 198 0 0 1 400 59.99453711333962 &#10;A 198 198 0 0 1 400 366.0054628866604" style="fill-opacity: 0; fill: transparent;"/><text class="label" text-anchor="middle" dy=".35em" x="400" y="212" style="fill: rgb(51, 51, 51); font-size: 24px;"><tspan x="400" y="212" dy="0.35em">Fullstack</tspan></text></g></g></svg>