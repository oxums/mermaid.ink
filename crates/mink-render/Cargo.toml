[package]
name = "mink-render"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
mink-core = { path = "../mink-core" }
# merman::svg::export re-exports merman-export 0.10.0 (enabled through these features).
merman = { version = "=0.10.0", features = ["png", "jpeg", "pdf", "math", "native-fonts", "system-clock"] }
# Only for RenderEnvironment (the session `finalize_resvg_svg` needs); same version merman uses.
merman-render = { version = "=0.10.0", default-features = false }
libwebp-sys = "0.14.4"
base64 = "0.23"
lopdf = { version = "0.47", default-features = false }
png = "0.18"
svgtypes = "0.16"
roxmltree = "0.21"
serde_json = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
